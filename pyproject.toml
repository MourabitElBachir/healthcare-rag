[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-rag"
version = "0.1.0"
description = "Local extractive retrieval with exact passage citations"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "El Bachir Mourabit" }]
dependencies = ["sentence-transformers", "chromadb", "pypdf", "trafilatura"]

[project.optional-dependencies]
dev = ["pytest"]
ui = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
